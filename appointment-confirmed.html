<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Response recorded</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --card: #ffffff;
      --border: rgba(0,0,0,0.08);
      --text-primary: #1a1a18;
      --text-secondary: #6b6b66;
      --text-tertiary: #9e9e99;
      --green-bg: #eaf3de;
      --green-text: #2a5a0e;
      --green-border: #b5d97a;
      --red-bg: #fceaea;
      --red-text: #7a1f1f;
      --red-border: #f0a0a0;
      --blue-bg: #e6f0fb;
      --blue-text: #0c3d7c;
      --blue-border: #85b2eb;
      --check-ring: #d4edbc;
      --check-fill: #3b6d11;
      --accent: #3b6d11;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 40px 36px 36px;
      text-align: center;
    }

    .check-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--green-bg);
      border: 4px solid var(--check-ring);
      margin-bottom: 22px;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .check-wrap svg {
      width: 28px;
      height: 28px;
      stroke: var(--check-fill);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: draw 0.4s 0.2s ease both;
    }

    @keyframes draw {
      0% { stroke-dasharray: 40; stroke-dashoffset: 40; }
      100% { stroke-dasharray: 40; stroke-dashoffset: 0; }
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .detail-box {
      background: #fafaf8;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 16px;
      font-size: 13px;
    }

    .detail-row + .detail-row {
      border-top: 1px solid var(--border);
    }

    .detail-label {
      color: var(--text-secondary);
    }

    .detail-value {
      font-weight: 500;
      color: var(--text-primary);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .badge-yes {
      background: var(--green-bg);
      color: var(--green-text);
      border-color: var(--green-border);
    }

    .badge-no {
      background: var(--red-bg);
      color: var(--red-text);
      border-color: var(--red-border);
    }

    .badge-score {
      background: var(--blue-bg);
      color: var(--blue-text);
      border-color: var(--blue-border);
    }

    .close-note {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .no-score-note {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-wrap">
      <svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 7"/></svg>
    </div>

    <h1>Got it, thanks!</h1>
    <p class="subtitle">Your response has been recorded and HubSpot has been updated automatically.</p>

    <div class="detail-box">
      <div class="detail-row">
        <span class="detail-label">Deal</span>
        <span class="detail-value" id="deal-name">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Appointment happened</span>
        <span id="happened-badge" class="badge">—</span>
      </div>
      <div class="detail-row" id="score-row">
        <span class="detail-label">Score</span>
        <span id="score-badge" class="badge badge-score">—</span>
      </div>
    </div>

    <p class="close-note">You can close this tab.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const dealName = params.get('deal_name');
    const happened = params.get('happened');
    const score = params.get('score');

    if (dealName) {
      document.getElementById('deal-name').textContent = decodeURIComponent(dealName);
    }

    const happenedBadge = document.getElementById('happened-badge');
    if (happened === 'yes') {
      happenedBadge.textContent = 'Yes';
      happenedBadge.classList.add('badge-yes');
    } else if (happened === 'no') {
      happenedBadge.textContent = 'No';
      happenedBadge.classList.add('badge-no');
      document.getElementById('score-row').style.display = 'none';
    } else {
      happenedBadge.textContent = '—';
    }

    if (score && happened === 'yes') {
      document.getElementById('score-badge').textContent = score + ' / 10';
    }
  </script>
</body>
</html>
