
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Response recorded</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --card: #ffffff;
      --border: rgba(0,0,0,0.08);
      --text-primary: #1a1a18;
      --text-secondary: #6b6b66;
      --text-tertiary: #9e9e99;
      --green-bg: #eaf3de;
      --green-text: #2a5a0e;
      --green-border: #b5d97a;
      --red-bg: #fceaea;
      --red-text: #7a1f1f;
      --red-border: #f0a0a0;
      --blue-bg: #e6f0fb;
      --blue-text: #0c3d7c;
      --blue-border: #85b2eb;
      --amber-bg: #fef3cd;
      --amber-text: #7a4f00;
      --amber-border: #f0c96e;
      --check-ring: #d4edbc;
      --check-fill: #3b6d11;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 40px 36px 36px;
      text-align: center;
    }

    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin-bottom: 22px;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    .icon-wrap.success { background: var(--green-bg); border: 4px solid var(--check-ring); }
    .icon-wrap.missed  { background: var(--red-bg);   border: 4px solid var(--red-border); }
    .icon-wrap.sending { background: var(--blue-bg);  border: 4px solid var(--blue-border); }

    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    .icon-wrap svg {
      width: 28px; height: 28px;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none;
    }
    .icon-wrap.success svg { stroke: var(--check-fill); animation: draw 0.4s 0.2s ease both; }
    .icon-wrap.missed  svg { stroke: var(--red-text);   animation: draw 0.4s 0.2s ease both; }

    @keyframes draw {
      0%   { stroke-dasharray: 40; stroke-dashoffset: 40; }
      100% { stroke-dasharray: 40; stroke-dashoffset: 0; }
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid var(--blue-border);
      border-top-color: var(--blue-text);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-size: 22px; font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px; letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.6; margin-bottom: 28px;
    }

    .detail-box {
      background: #fafaf8;
      border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      margin-bottom: 24px; text-align: left;
    }

    .detail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 16px; font-size: 13px;
    }
    .detail-row + .detail-row { border-top: 1px solid var(--border); }
    .detail-label { color: var(--text-secondary); flex-shrink: 0; }
    .detail-value {
      font-weight: 500; color: var(--text-primary);
      font-family: 'DM Mono', monospace; font-size: 12px;
      text-align: right; max-width: 60%; word-break: break-word;
    }

    .badge {
      display: inline-block; padding: 3px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 500;
      border: 1px solid transparent;
    }
    .badge-green { background: var(--green-bg); color: var(--green-text); border-color: var(--green-border); }
    .badge-red   { background: var(--red-bg);   color: var(--red-text);   border-color: var(--red-border); }
    .badge-blue  { background: var(--blue-bg);  color: var(--blue-text);  border-color: var(--blue-border); }
    .badge-amber { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber-border); }

    .close-note { font-size: 12px; color: var(--text-tertiary); }

    .error-note {
      font-size: 13px; color: var(--red-text);
      background: var(--red-bg); border: 1px solid var(--red-border);
      border-radius: 8px; padding: 10px 14px;
      margin-bottom: 20px; line-height: 1.5;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap sending" id="icon-wrap">
      <div class="spinner"></div>
    </div>

    <h1 id="heading">Updating HubSpot…</h1>
    <p class="subtitle" id="subtitle">Sending your response, please wait a moment.</p>

    <div class="detail-box">
      <div class="detail-row">
        <span class="detail-label">Deal</span>
        <span class="detail-value" id="deal-name">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Outcome</span>
        <span id="outcome-badge" class="badge">—</span>
      </div>
    </div>

    <div class="error-note hidden" id="error-note">
      HubSpot couldn't be updated automatically. Please update the deal manually.
    </div>

    <p class="close-note hidden" id="close-note">You can close this tab.</p>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);

    const dealName     = p.get('deal_name');
    const outcomeLabel = p.get('outcome_label');
    const dealId       = p.get('deal_id');
    const stageId      = p.get('stage_id');
    const webhookRaw   = p.get('webhook');

    // Populate deal name
    if (dealName) {
      document.getElementById('deal-name').textContent = decodeURIComponent(dealName.replace(/\+/g, ' '));
    }

    // Outcome badge
    const outcomeBadge = document.getElementById('outcome-badge');
    if (outcomeLabel) {
      const label = decodeURIComponent(outcomeLabel.replace(/\+/g, ' '));
      outcomeBadge.textContent = label;
      const lower = label.toLowerCase();
      if (lower.includes('missed') || lower.includes('cancelled') || lower.includes('no deal')) {
        outcomeBadge.classList.add('badge-red');
      } else if (lower.includes('contract') || lower.includes('converting')) {
        outcomeBadge.classList.add('badge-green');
      } else if (lower.includes('nurture') || lower.includes('time')) {
        outcomeBadge.classList.add('badge-amber');
      } else {
        outcomeBadge.classList.add('badge-blue');
      }
    }

    function showSuccess() {
      const wrap = document.getElementById('icon-wrap');
      wrap.className = 'icon-wrap success';
      wrap.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 7"/></svg>';
      document.getElementById('heading').textContent = 'Got it, thanks!';
      document.getElementById('subtitle').textContent = 'Your response has been recorded and HubSpot has been updated automatically.';
      document.getElementById('close-note').classList.remove('hidden');
    }

    function showMissed() {
      const wrap = document.getElementById('icon-wrap');
      wrap.className = 'icon-wrap missed';
      wrap.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      document.getElementById('heading').textContent = 'Got it, thanks!';
      document.getElementById('subtitle').textContent = 'HubSpot has been updated automatically.';
      document.getElementById('close-note').classList.remove('hidden');
    }

    function showError() {
      const wrap = document.getElementById('icon-wrap');
      wrap.className = 'icon-wrap missed';
      wrap.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      document.getElementById('heading').textContent = 'Something went wrong';
      document.getElementById('subtitle').textContent = '';
      document.getElementById('error-note').classList.remove('hidden');
      document.getElementById('close-note').classList.remove('hidden');
    }

    function resolveOutcome() {
      const label = outcomeLabel ? decodeURIComponent(outcomeLabel.replace(/\+/g, ' ')).toLowerCase() : '';
      if (label.includes('missed') || label.includes('cancelled') || label.includes('no deal')) {
        showMissed();
      } else {
        showSuccess();
      }
    }

    if (webhookRaw) {
      try {
        const webhookDecoded = decodeURIComponent(webhookRaw);
        const url = new URL(webhookDecoded);
        if (dealId)       url.searchParams.set('deal_id', dealId);
        if (stageId)      url.searchParams.set('stage_id', stageId);
        if (outcomeLabel) url.searchParams.set('outcome_label', outcomeLabel);
        if (dealName)     url.searchParams.set('deal_name', dealName);

        fetch(url.toString(), { mode: 'no-cors' })
          .then(() => resolveOutcome())
          .catch(() => showError());
      } catch (e) {
        showError();
      }
    } else {
      // No webhook param — just display (e.g. direct visit / testing)
      resolveOutcome();
    }
  </script>
</body>
</html>
